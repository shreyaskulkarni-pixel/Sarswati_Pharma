trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  imageRepository: medassist-ai
  containerRegistry: acrserviceconnection
  kubernetesServiceConnection: aksservice
  namespace: medassist
  dockerfilePath: Dockerfile
  tag: $(Build.BuildId)

stages:
  - stage: Build
    displayName: Build and Push
    jobs:
      - job: BuildPush
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build and push image
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(containerRegistry)
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployAKS
        displayName: Apply manifests
        environment: aks-prod
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - script: |
                    echo "Files:"
                    ls -R
                  displayName: Debug file
                - task: KubernetesManifest@1
                  displayName: Deploy manifests
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: $(kubernetesServiceConnection)
                    namespace: $(namespace)
                    manifests: |
                      $(System.DefaultWorkingDirectory)/aks/deployment.yaml
                      $(System.DefaultWorkingDirectory)/aks/service.yaml
                      $(System.DefaultWorkingDirectory)/aks/ingress.yaml
                    containers: |
                      acrpharmacy.azurecr.io/medassist-ai:latest



